name: Final Project Ci/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  Running-Automation-Test:

    runs-on: ubuntu-latest
   
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run Web Tests
        run: ./gradlew runCucumberTests -Dcucumber.filter.tags="@web"

      - name:  Run API Tests
        run: ./gradlew runCucumberTests -Dcucumber.filter.tags="@api"

      - name: Upload Web Test Report
        uses: actions/upload-artifact@v4
        with:
          name: web-report
          path: |
            reports/web_report.html
            reports/web_report.json

      - name: Upload API Test Report
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            reports/api_report.html
            reports/api_report.json
            
      - name: 🚀 Deploy Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports  # or wherever your report files live
